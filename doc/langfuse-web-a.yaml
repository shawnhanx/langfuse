        app.kubernetes.io/instance: langfuse-a
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: langfuse-web
          image: registry.baidubce.com/cce-plugin-dev/langfuse:202601092
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
